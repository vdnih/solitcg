id: dragon_calling_melody
name: 竜呼びの旋律
type: spell
tags: [dragon_support]
text: 手札を1枚選んで捨てる。その後、デッキから「high_level」タグのモンスターを2体まで手札に加える。
version: 1

abilities:
  - when: on_play
    effect:
      # 捨てる手札が無ければ discard が失敗し、サーチも行われない
      - { op: discard, from: hand, count: 1, selection: choose }
      - { op: search, from: deck, to: hand, filter: { tag: "high_level" }, max: 2 }
